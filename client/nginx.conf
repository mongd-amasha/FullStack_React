server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /FullStack_React/;
  }

  location = /FullStack_React {
    return 301 /FullStack_React/;
  }

  location ^~ /FullStack_React/assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /FullStack_React/ {
    try_files $uri $uri/ /FullStack_React/index.html;
  }

  location / {
    try_files $uri =404;
  }
}
